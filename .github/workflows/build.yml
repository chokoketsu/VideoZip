name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Build single-file exe
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name VideoZip
          --icon "$env:GITHUB_WORKSPACE/assets/icon.ico"
          --collect-all tkinterdnd2
          --workpath build --distpath dist --specpath build
          videozip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoZip-windows-x64
          path: dist/VideoZip.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoZip.exe
